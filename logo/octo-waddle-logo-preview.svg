<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Probable Octo Waddle: logo concept preview</title>
  <desc id="description">An eight-armed octopus mark with a friendly face, shown with the current name, on light and dark backgrounds, and at small sizes. Design concept only.</desc>
  <defs>
    <mask id="face" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="white"/>
      <circle cx="107" cy="105" r="6.5" fill="black"/>
      <circle cx="149" cy="105" r="6.5" fill="black"/>
      <path d="M118 125Q128 133 138 125" stroke="black" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </mask>
    <symbol id="octopus" viewBox="0 0 256 256">
      <g fill="currentColor" stroke="currentColor" mask="url(#face)">
        <path d="M74 116H49Q29 116 29 98M76 137L48 149Q30 159 24 143M94 149L72 183Q60 201 47 189M115 157V191Q115 217 94 217M140 157V194Q140 216 161 216M160 147L181 182Q193 199 207 187M180 134L206 148Q225 158 232 140M182 112H207Q227 112 227 94" fill="none" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M68 120V102C68 66 92 42 128 42S188 66 188 102V120C188 146 164 164 128 164S68 146 68 120Z" stroke="none"/>
      </g>
    </symbol>
  </defs>
  <rect width="1200" height="900" fill="#f8faf8"/>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="64" y="64" fill="#586b63" font-size="13" font-weight="600" letter-spacing="2">PROBABLE OCTO WADDLE / BRAND CONCEPT 01</text>
    <text x="1136" y="64" text-anchor="end" fill="#586b63" font-size="13">Exploration, not a website update</text>
    <line x1="64" y1="88" x2="1136" y2="88" stroke="#dce4de"/>
    <rect x="64" y="124" width="1072" height="360" rx="24" fill="white" stroke="#dce4de"/>
    <use href="#octopus" x="182" y="174" width="256" height="256" color="#245e44"/>
    <line x1="489" y1="222" x2="489" y2="392" stroke="#dce4de"/>
    <text x="544" y="283" fill="#586b63" font-size="25" font-weight="500" letter-spacing="1">Probable</text>
    <text x="541" y="350" fill="#192c26" font-size="62" font-weight="650" letter-spacing="-2">Octo Waddle</text>
    <text x="544" y="390" fill="#586b63" font-size="17">Playful name. Useful tools.</text>
    <rect x="64" y="512" width="344" height="236" rx="18" fill="#192c26"/>
    <text x="88" y="550" fill="#c5f4d3" font-size="11" font-weight="600" letter-spacing="1.5">ON DARK</text>
    <use href="#octopus" x="156" y="566" width="160" height="160" color="#c5f4d3"/>
    <rect x="428" y="512" width="344" height="236" rx="18" fill="#edf4ee" stroke="#dce4de"/>
    <text x="452" y="550" fill="#586b63" font-size="11" font-weight="600" letter-spacing="1.5">SINGLE COLOR</text>
    <use href="#octopus" x="520" y="566" width="160" height="160" color="#192c26"/>
    <rect x="792" y="512" width="344" height="236" rx="18" fill="white" stroke="#dce4de"/>
    <text x="816" y="550" fill="#586b63" font-size="11" font-weight="600" letter-spacing="1.5">SMALL-SIZE STUDY</text>
    <rect x="829" y="600" width="72" height="72" rx="16" fill="#192c26"/>
    <use href="#octopus" x="833" y="604" width="64" height="64" color="#c5f4d3"/>
    <rect x="931" y="612" width="48" height="48" rx="11" fill="#192c26"/>
    <use href="#octopus" x="935" y="616" width="40" height="40" color="#c5f4d3"/>
    <rect x="1009" y="620" width="32" height="32" rx="7" fill="#192c26"/>
    <use href="#octopus" x="1013" y="624" width="24" height="24" color="#c5f4d3"/>
    <text x="865" y="710" text-anchor="middle" fill="#586b63" font-size="12">64 px</text>
    <text x="955" y="710" text-anchor="middle" fill="#586b63" font-size="12">40 px</text>
    <text x="1025" y="710" text-anchor="middle" fill="#586b63" font-size="12">24 px</text>
    <line x1="64" y1="790" x2="1136" y2="790" stroke="#dce4de"/>
    <text x="64" y="828" fill="#192c26" font-size="18" font-weight="600">Eight arms. One helpful little companion.</text>
    <text x="64" y="857" fill="#586b63" font-size="14">A rounded silhouette, gently uneven curls, and a friendly face in the collection's existing greens.</text>
    <text x="1136" y="858" text-anchor="end" fill="#586b63" font-size="12">Custom vector concept / Not trademark-cleared</text>
